name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (skip native addon build)
        run: npm ci --ignore-scripts

      - name: Cache HEIF static libraries
        id: heif-cache
        uses: actions/cache@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-windows-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}
          restore-keys: |
            heif-deps-windows-

      - name: Build static HEIF dependencies
        if: ${{ !hashFiles('packages/heif-decode/deps/lib/libheif.lib') }}
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh

      - name: Build HEIF addon with static linking
        working-directory: packages/heif-decode
        run: npx node-gyp rebuild --heif_static=true

      - name: Build and package (Windows)
        run: npm run package:win
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepic-windows
          path: dist-electron/*.exe
          retention-days: 5

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip native addon build)
        run: npm ci --ignore-scripts

      - name: Cache HEIF static libraries
        id: heif-cache
        uses: actions/cache@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-macos-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}
          restore-keys: |
            heif-deps-macos-

      - name: Build static HEIF dependencies
        if: ${{ !hashFiles('packages/heif-decode/deps/lib/libheif.a') }}
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh

      - name: Build HEIF addon with static linking
        working-directory: packages/heif-decode
        run: npx node-gyp rebuild --heif_static=true

      - name: Build and package (macOS)
        run: npm run package:mac
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepic-macos
          path: dist-electron/*.dmg
          retention-days: 5

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: keepic-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: keepic-macos
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
