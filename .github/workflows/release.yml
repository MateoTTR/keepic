name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Dry run: build and verify both installers on any branch without
  # publishing a GitHub Release (create-release only runs for tags).
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows installer
    # Pinned to VS 2022: heif_decode.node built with VS 2026 (windows-latest
    # since June 2026) fails DLL initialization on some Windows Server 2025
    # machines ("A dynamic link library (DLL) initialization routine failed"),
    # while the VS 2022 build loads everywhere. See TASK-075. The cache key
    # names the toolchain so VS 2026-built deps are never restored here.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (skip native addon build)
        run: npm ci --ignore-scripts

      # Exact key only: a prefix fallback could restore deps built by an older
      # build-deps.sh (e.g. a previous libheif version). The main-scoped cache
      # is kept warm by cache-heif-deps.yml; on a miss, deps are built here.
      - name: Restore HEIF static libraries from cache
        id: heif-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-windows-2022-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}

      - name: Build static HEIF dependencies
        if: steps.heif-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh

      - name: Build HEIF addon with static linking
        run: npm run build:heif-static

      # electron-builder runs `npm rebuild` on native deps while packaging. If
      # node-gyp-build rejects the addon built above, it rebuilds from source:
      # npm_config_heif_static makes that rebuild static too (node-gyp passes
      # npm_config_* through as gyp variables), and the node-gyp devDependency
      # is used instead of npm's bundled one, which predates VS 2026.
      - name: Build and package (Windows)
        run: npm run package:win
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          npm_config_heif_static: 'true'

      # The packaged addon must embed libheif/libde265 statically. The smoke
      # test decodes real HEIC files with the same build/Release binary that
      # electron-builder copied into the app.
      - name: Verify packaged HEIF addon
        run: |
          $addon = "dist-electron/win-unpacked/resources/app.asar.unpacked/node_modules/@keepic/heif-decode/build/Release/heif_decode.node"
          if (-not (Test-Path $addon)) { Write-Error "Missing $addon"; exit 1 }
          $deps = dumpbin /dependents $addon | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed"; exit 1 }
          Write-Output $deps
          if ($deps -match '(?im)^\s+\S*(heif|de265)\S*\.dll\s*$') {
            Write-Error "heif_decode.node is dynamically linked to libheif/libde265"
            exit 1
          }
          node packages/heif-decode/test/smoke-test.js

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepic-windows
          path: dist-electron/*.exe
          retention-days: 5

  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip native addon build)
        run: npm ci --ignore-scripts

      # Exact key only: a prefix fallback could restore deps built by an older
      # build-deps.sh (e.g. a previous libheif version). The main-scoped cache
      # is kept warm by cache-heif-deps.yml; on a miss, deps are built here.
      - name: Restore HEIF static libraries from cache
        id: heif-cache
        uses: actions/cache/restore@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-macos-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}

      - name: Build static HEIF dependencies
        if: steps.heif-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh

      - name: Build HEIF addon with static linking
        run: npm run build:heif-static

      # See the Windows job for why npm_config_heif_static is set here.
      - name: Build and package (macOS)
        run: npm run package:mac
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          npm_config_heif_static: 'true'

      - name: Verify packaged HEIF addon
        run: |
          ADDON="dist-electron/mac-arm64/KeePic.app/Contents/Resources/app.asar.unpacked/node_modules/@keepic/heif-decode/build/Release/heif_decode.node"
          otool -L "$ADDON"
          if otool -L "$ADDON" | tail -n +2 | grep -iE 'heif|de265'; then
            echo "::error::heif_decode.node is dynamically linked to libheif/libde265"
            exit 1
          fi
          node packages/heif-decode/test/smoke-test.js

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepic-macos
          path: dist-electron/*.dmg
          retention-days: 5

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: keepic-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: keepic-macos
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
