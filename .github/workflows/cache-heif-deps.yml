name: Warm HEIF deps cache

# Release builds run on tag refs, which can only restore caches saved on the
# default branch (main). This workflow keeps the main-scoped HEIF deps cache
# alive so releases can skip building libde265 + libheif from source:
# - on every push to main, i.e. right after a release PR is merged
# - twice a week, because GitHub evicts caches not accessed for 7 days
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1,4'

concurrency:
  group: warm-heif-deps-cache
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cache-windows:
    name: Cache HEIF deps (Windows)
    # Must match the release build toolchain (VS 2022), see release.yml
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Full restore (not lookup-only) so the cache's last-access time is
      # refreshed; on a miss, the post step saves the freshly built deps.
      - name: Restore or create HEIF deps cache
        id: heif-cache
        uses: actions/cache@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-windows-2022-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}

      - name: Setup MSVC
        if: steps.heif-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build static HEIF dependencies
        if: steps.heif-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh

  cache-macos:
    name: Cache HEIF deps (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore or create HEIF deps cache
        id: heif-cache
        uses: actions/cache@v4
        with:
          path: packages/heif-decode/deps
          key: heif-deps-macos-${{ hashFiles('packages/heif-decode/scripts/build-deps.sh') }}

      - name: Build static HEIF dependencies
        if: steps.heif-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: packages/heif-decode
        run: bash scripts/build-deps.sh
