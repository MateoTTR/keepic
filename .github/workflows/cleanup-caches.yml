name: Cleanup branch caches

on:
  delete:

jobs:
  cleanup:
    name: Purge caches for deleted branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cleanup caches
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.ref;
            console.log(`Cleaning caches for branch: ${branch}`);
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
            });
            for (const cache of caches.data.actions_caches) {
              console.log(`Deleting cache: ${cache.key} (${(cache.size_in_bytes / 1048576).toFixed(0)} MB)`);
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }
            console.log(`Deleted ${caches.data.actions_caches.length} caches.`);
